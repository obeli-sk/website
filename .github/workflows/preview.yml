name: preview
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
    types: [opened, synchronize, reopened]

defaults:
  run:
    shell: bash -xe {0}

jobs:
  deploy-preview:
    name: deploy preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Populate the nix store
        run: nix develop --command echo

      - name: zola check
        run: nix develop --command zola check --skip-external-links

      - name: latest docs external links
        run: nix develop --command bash scripts/check-latest-docs-external-links.sh

      - name: zola build
        run: |
          PREVIEW_URL="https://pr-${{ github.event.number }}.website-1w7.pages.dev"
          nix develop --command zola build --base-url "$PREVIEW_URL"

      - name: Deploy preview
        id: deploy
        run: |
          BRANCH="pr-${{ github.event.number }}"
          URL="https://${BRANCH}.website-1w7.pages.dev"
          nix develop --command wrangler pages deploy ./public/ \
            --project-name=website \
            --branch="$BRANCH"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- preview-deploy -->

      - name: Comment preview URL
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.number }}
          edit-mode: replace
          body: |
            <!-- preview-deploy -->
            👀 Preview deployed: ${{ steps.deploy.outputs.url }}
