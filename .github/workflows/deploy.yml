name: check
permissions:
  contents: read
on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -xe {0}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=
      - name: Populate the nix store
        run: |
          nix develop --command echo

      - name: zola build
        run: nix develop --command zola build

      - name: wrangler deploy
        run: nix develop --command wrangler pages deploy ./public/ --project-name=website
        env:
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
