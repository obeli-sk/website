<svg role="img" aria-labelledby="js-replay-title js-replay-desc" style="display:block;width:760px;max-width:none;height:auto;color:var(--text)" 
 width="760" height="190"
 viewBox="0 0 760 190"
 xmlns="http://www.w3.org/2000/svg"
 xmlns:xlink="http://www.w3.org/1999/xlink"
>

<title id="js-replay-title">Workflow-agent replay time</title>
<desc id="js-replay-desc">Workflow replay time over nine measured calls. boa-wasm: median 3171 ms, range 3122–3255 ms; rust-wasm: median 106 ms, range 105–117 ms; v8: median 128 ms, range 123–140 ms.</desc>

<g id="gnuplot_canvas">

<rect x="0" y="0" width="760" height="190" fill="none"/>
<defs>

	<circle id='gpDot' r='0.5' stroke-width='0.5' stroke='currentColor'/>
	<path id='gpPt0' stroke-width='0.190' stroke='currentColor' d='M-1,0 h2 M0,-1 v2'/>
	<path id='gpPt1' stroke-width='0.190' stroke='currentColor' d='M-1,-1 L1,1 M1,-1 L-1,1'/>
	<path id='gpPt2' stroke-width='0.190' stroke='currentColor' d='M-1,0 L1,0 M0,-1 L0,1 M-1,-1 L1,1 M-1,1 L1,-1'/>
	<rect id='gpPt3' stroke-width='0.190' stroke='currentColor' x='-1' y='-1' width='2' height='2'/>
	<rect id='gpPt4' stroke-width='0.190' stroke='currentColor' fill='currentColor' x='-1' y='-1' width='2' height='2'/>
	<circle id='gpPt5' stroke-width='0.190' stroke='currentColor' cx='0' cy='0' r='1'/>
	<use xlink:href='#gpPt5' id='gpPt6' fill='currentColor' stroke='none'/>
	<path id='gpPt7' stroke-width='0.190' stroke='currentColor' d='M0,-1.33 L-1.33,0.67 L1.33,0.67 z'/>
	<use xlink:href='#gpPt7' id='gpPt8' fill='currentColor' stroke='none'/>
	<use xlink:href='#gpPt7' id='gpPt9' stroke='currentColor' transform='rotate(180)'/>
	<use xlink:href='#gpPt9' id='gpPt10' fill='currentColor' stroke='none'/>
	<use xlink:href='#gpPt3' id='gpPt11' stroke='currentColor' transform='rotate(45)'/>
	<use xlink:href='#gpPt11' id='gpPt12' fill='currentColor' stroke='none'/>
	<path id='gpPt13' stroke-width='0.190' stroke='currentColor' d='M0,1.330 L1.265,0.411 L0.782,-1.067 L-0.782,-1.076 L-1.265,0.411 z'/>
	<use xlink:href='#gpPt13' id='gpPt14' fill='currentColor' stroke='none'/>
	<filter id='textbox' filterUnits='objectBoundingBox' x='0' y='0' height='1' width='1'>
	  <feFlood flood-color='var(--bg)' flood-opacity='1' result='bgnd'/>
	  <feComposite in='SourceGraphic' in2='bgnd' operator='atop'/>
	</filter>
	<filter id='greybox' filterUnits='objectBoundingBox' x='0' y='0' height='1' width='1'>
	  <feFlood flood-color='lightgrey' flood-opacity='1' result='grey'/>
	  <feComposite in='SourceGraphic' in2='grey' operator='atop'/>
	</filter>
</defs>
<g fill="none" color="currentColor" stroke="currentColor" stroke-width="1.00" stroke-linecap="butt" stroke-linejoin="miter">
</g>
<g fill="none" color="currentColor" stroke="currentColor" stroke-width="1.00" stroke-linecap="butt" stroke-linejoin="miter">
	<g transform="translate(20.00,66.25)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>JavaScript / V8</text>
	</g>
	<g transform="translate(669.99,66.25)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>123–140 ms</text>
	</g>
	<g transform="translate(20.00,95.87)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>Rust / Wasmtime</text>
	</g>
	<g transform="translate(669.99,95.87)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>105–117 ms</text>
	</g>
	<g transform="translate(20.00,125.48)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>JavaScript / Boa WASM</text>
	</g>
	<g transform="translate(669.99,125.48)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>3.1–3.3 s</text>
	</g>
	<g transform="translate(20.00,27.36)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text font-weight="700">Workflow-agent replay: 726 events</text>
	</g>
	<g transform="translate(585.19,27.36)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>scale: 0–4 s</text>
	</g>
	<g transform="translate(20.00,175.55)" stroke="none" fill="currentColor" font-family="system-ui, sans-serif" font-size="14.00"  text-anchor="start">
		<text>Median bars; labels show observed ranges</text>
	</g>
</g>
<g fill="none" color="currentColor" stroke="currentColor" stroke-width="1.00" stroke-linecap="butt" stroke-linejoin="miter">
	<path stroke='color-mix(in srgb, var(--text, currentColor) 35%, transparent)'  d='M200.01,138.69 L200.01,38.00  '/></g>
<g fill="none" color="currentColor" stroke="currentColor" stroke-width="1.00" stroke-linecap="butt" stroke-linejoin="miter">
	<path stroke='color-mix(in srgb, var(--text, currentColor) 35%, transparent)'  d='M600.00,138.69 L600.00,38.00  '/></g>
<g fill="none" color="currentColor" stroke="currentColor" stroke-width="1.00" stroke-linecap="butt" stroke-linejoin="miter">
</g>
