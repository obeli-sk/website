<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#151521"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DF2FE"/>
      <stop offset="1" stop-color="#70D9E5"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="640" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8BE9FD"/>
    </marker>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>

  <rect x="56" y="54" width="1088" height="76" rx="20" fill="#171A28" stroke="#2B3550"/>
  <text x="86" y="92" fill="#F4F7FB" font-family="Georgia, serif" font-size="34" font-weight="700">
    Durable workflows with almost no infrastructure
  </text>
  <text x="86" y="118" fill="#B8C3D6" font-family="Arial, sans-serif" font-size="20">
    SQLite state backed up to S3, with selective pull for inspection
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="172" width="300" height="318" rx="26" fill="#242739" stroke="#3A405B" stroke-width="2"/>
    <text x="92" y="214" fill="#9DF2FE" font-family="Arial, sans-serif" font-size="17" font-weight="700">
      MANY SMALL NODES
    </text>

    <rect x="116" y="286" width="176" height="132" rx="22" fill="#1A1D2C" stroke="#38415D" opacity="0.55"/>
    <rect x="132" y="270" width="176" height="132" rx="22" fill="#1A1D2C" stroke="#38415D" opacity="0.78"/>
    <rect x="148" y="254" width="176" height="132" rx="22" fill="#171A28" stroke="#44506E"/>

    <text x="170" y="288" fill="#9DF2FE" font-family="Arial, sans-serif" font-size="14" font-weight="700">
      OBELISK NODE
    </text>
    <text x="170" y="320" fill="#F4F7FB" font-family="Georgia, serif" font-size="26" font-weight="700">
      Obelisk
    </text>

    <rect x="174" y="336" width="124" height="34" rx="10" fill="#223042" stroke="#8BE9FD" stroke-width="2"/>
    <text x="197" y="359" fill="#F4F7FB" font-family="Arial, sans-serif" font-size="18" font-weight="700">
      SQLite DB
    </text>
  </g>

  <path d="M372 324 H 438" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="450" y="172" width="300" height="318" rx="26" fill="#1E2B33" stroke="#36505E" stroke-width="2"/>
    <text x="482" y="214" fill="#9DF2FE" font-family="Arial, sans-serif" font-size="17" font-weight="700">
      S3 BACKUPS
    </text>

    <path d="M600 274 C570 274, 546 292, 542 320 C516 323, 498 342, 498 366 C498 392, 518 410, 546 410 H654 C682 410, 704 390, 704 364 C704 338, 684 318, 658 316 C652 292, 628 274, 600 274 Z" fill="#171A28" stroke="#8BE9FD" stroke-width="2"/>
    <text x="579" y="353" fill="#F4F7FB" font-family="Georgia, serif" font-size="34" font-weight="700">
      S3
    </text>
    <rect x="553" y="370" width="102" height="10" rx="5" fill="url(#accent)"/>

  </g>

  <path d="M762 324 H 828" stroke="#8BE9FD" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="840" y="172" width="300" height="318" rx="26" fill="#242739" stroke="#3A405B" stroke-width="2"/>
    <text x="872" y="214" fill="#9DF2FE" font-family="Arial, sans-serif" font-size="17" font-weight="700">
      OBSERVER
    </text>

    <rect x="913" y="274" width="154" height="94" rx="14" fill="#171A28" stroke="#44506E"/>
    <rect x="927" y="288" width="126" height="58" rx="10" fill="#223042" stroke="#8BE9FD" stroke-width="2"/>
    <rect x="905" y="372" width="170" height="12" rx="6" fill="#44506E"/>

  </g>

  <rect x="70" y="514" width="1060" height="78" rx="18" fill="#171A28" stroke="#2A3148"/>
  <text x="98" y="557" fill="#D5DCEC" font-family="Arial, sans-serif" font-size="17">
    Good fit for agent workflows: many small durable experiments with async backups.
  </text>
  <text x="98" y="577" fill="#D5DCEC" font-family="Arial, sans-serif" font-size="17">
    The observer can be a developer or another agent pulling only the databases that matter.
  </text>
</svg>
