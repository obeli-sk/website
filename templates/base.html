<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    {% block meta_description %}{% endblock %}
    {% block rss %}
    <link rel="alternate" type="application/rss+xml" title="Obelisk Blog RSS"
        href="{{ get_url(path='blog/rss.xml', trailing_slash=false) | safe }}" />
    {% endblock %}
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{{ get_url(path='style.css') | safe }}" />
</head>

<body>
    <nav>
        <div class="container nav-content">
            <div class="logo">
                <a href="{{ config.base_url }}">
                    <img src="{{ get_url(path='logo.png') }}" alt="Obelisk logo" />
                    Obelisk
                </a>
            </div>
            <div class="nav-links">
                <a href="{{ get_url(path='@/features/_index.md') }}">Features</a>
                <a href="{{ get_url(path='@/docs/latest/js/getting-started.md') }}">Get Started</a>
                <a href="{{ get_url(path='@/docs/v0.42.0/apps.md') }}">Apps</a>
                <a href="{{ get_url(path='@/blog/_index.md') }}">Blog</a>
                <a href="{{ get_url(path='@/docs/latest/_index.md') }}">Docs</a>
                <a href="https://github.com/obeli-sk/obelisk" target="_blank">GitHub</a>
            </div>
        </div>
    </nav>
    <script>
        (function () {
            var nav = document.querySelector("nav");
            var root = document.documentElement;
            function update() { root.style.setProperty("--nav-h", nav.offsetHeight + "px"); }
            update();
            if (window.ResizeObserver) new ResizeObserver(update).observe(nav);
        })();
    </script>

    {% block content %}{% endblock %}
</body>

</html>
